name: Publicar site OzzyBox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - name: Preparar arquivos públicos
        env:
          SITE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir public
          cp index.html 404.html style.css site.js beneficios.js beneficios.json robots.txt public/
          cp -R assets public/
          sed -i 's/src="beneficios.js"/src="beneficios.js" data-catalog="beneficios.json"/' public/index.html
          sed -i "s|href=\"/|href=\"${SITE_PATH}/|g" public/404.html
          sed -i '/<\/head>/i\  <meta name="robots" content="noindex, follow">' public/index.html
          printf 'User-agent: *\nDisallow:\n' > public/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v5
        id: deploy
